<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>馬鹿広いメモ帳 タイル版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#dcdfe6; --sheet:#fafbfc; --ink:#1b1d22; --muted:#7c818c; --line:#e1e4ea;
  --chip:#eef0f4; --panel:rgba(255,255,255,.88); --accent:#3b55c9; --on-accent:#fff;
  --mark:rgba(59,85,201,.18); --shadow:0 8px 28px rgba(20,24,40,.12);
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "BIZ UDGothic", monospace;
  --sans:"Zen Kaku Gothic New", -apple-system, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --void:#141518; --sheet:#1e1e1e; --ink:#eceef2; --muted:#888d97; --line:#2c2e33;
    --chip:#2a2b2f; --panel:rgba(38,39,43,.86); --accent:#8ea6ff; --on-accent:#141518;
    --mark:rgba(142,166,255,.28); --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --void:#141518; --sheet:#1e1e1e; --ink:#eceef2; --muted:#888d97; --line:#2c2e33;
  --chip:#2a2b2f; --panel:rgba(38,39,43,.86); --accent:#8ea6ff; --on-accent:#141518;
  --mark:rgba(142,166,255,.28); --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--sheet);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}

#app{position:relative;width:100%;height:100%}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;
  background:var(--void) repeating-linear-gradient(135deg,transparent 0 14px,rgba(127,127,127,.07) 14px 15px)}
#world{position:absolute;left:0;top:0;will-change:transform}

/* シート */
.sheet{position:absolute;display:flex;flex-direction:column;background:var(--sheet);
  box-shadow:inset 0 0 0 1px var(--line);user-select:none;-webkit-user-select:none}
.sheet input,.sheet textarea{user-select:text;-webkit-user-select:text}
.sh-head{display:flex;align-items:center;gap:16px;min-height:68px;padding:16px 30px 4px;padding-right:var(--reserve,30px)}
.coord{display:inline-flex;align-items:baseline;gap:3px;flex:none;padding:4px 10px 5px;border-radius:7px;
  background:var(--chip);color:var(--muted);font-size:12px;transition:background .2s,color .2s}
.coord b{font-family:var(--mono);font-weight:600;font-size:16px;color:var(--ink);margin-right:6px}
.coord b:last-child{margin-right:0}
.sheet.flash .coord{animation:flash 1.1s ease-out}
@keyframes flash{0%,45%{background:var(--accent);color:var(--on-accent)}}
.sheet.flash .coord b{animation:flashb 1.1s ease-out}
@keyframes flashb{0%,45%{color:var(--on-accent)}}
.title{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:var(--sans);
  font-weight:700;font-size:22px;line-height:1.3;padding:4px 0;color:var(--ink)}
.title::placeholder{color:var(--muted);opacity:.55}
.upd{flex:none;font-size:12px;color:var(--muted);white-space:nowrap}
.body{flex:1;min-height:0;display:block;width:100%;border:none;outline:none;resize:none;background:transparent;
  padding:10px 30px 30px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;
  font-family:var(--mono);color:var(--ink)}
#stage.sans .body{font-family:var(--sans)}
#stage.tiny .title{font-size:7px}
.body::placeholder{color:var(--muted);opacity:.5}

/* ツールバー */
#toolbar{position:absolute;top:14px;right:16px;z-index:5;display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;height:40px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.search{padding:0 4px 0 12px;gap:8px}
.search svg{flex:none;width:16px;height:16px;color:var(--muted)}
#q{width:190px;min-width:0;border:none;outline:none;background:transparent;font-size:14px}
#q::placeholder{color:var(--muted)}
#scope{height:30px;border:none;border-radius:8px;background:var(--chip);padding:0 8px;font-size:13px;cursor:pointer;outline:none}
.jump{padding:0 4px 0 10px;gap:6px;font-size:13px;color:var(--muted)}
.jump label{display:flex;align-items:center;gap:4px}
.jump input{width:46px;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--sheet);
  text-align:center;font-family:var(--mono);font-size:13px;outline:none;color:var(--ink)}
.jump input:focus{border-color:var(--accent)}
.jump.err{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.btn{height:30px;border:none;border-radius:8px;background:var(--accent);color:var(--on-accent);padding:0 11px;
  font-size:13px;font-weight:700;cursor:pointer}
#fontBtn{width:40px;justify-content:center;cursor:pointer;font-weight:700;font-size:14px;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#results{position:absolute;top:50px;right:0;width:min(440px,calc(100vw - 32px));max-height:min(62vh,560px);
  overflow:auto;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#results[hidden]{display:none}
.rhead{display:flex;justify-content:space-between;padding:8px 10px 6px;font-size:12px;color:var(--muted)}
.grp{padding:10px 10px 4px;font-size:12px;font-weight:700;color:var(--muted)}
.hit{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;width:100%;padding:9px 10px;border:none;
  border-radius:9px;background:transparent;text-align:left;cursor:pointer}
.hit:hover,.hit.sel{background:var(--chip)}
.hc{grid-row:1/3;padding-top:2px;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.ht{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hu{font-size:11px;color:var(--muted);white-space:nowrap;padding-top:2px}
.hs{grid-column:2/4;font-size:12.5px;color:var(--muted);overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.empty{padding:18px 12px;font-size:13px;color:var(--muted)}
mark{background:var(--mark);color:var(--ink);border-radius:3px;padding:0 1px}

/* 位置表示とミニマップ */
#nav{position:absolute;right:16px;bottom:16px;z-index:4;display:flex;flex-direction:column;align-items:flex-end;
  gap:6px;opacity:.5;transition:opacity .2s}
#nav:hover,#nav:focus-within{opacity:1}
#pos{font-size:12px;color:var(--muted)}
#pos b{font-family:var(--mono);color:var(--ink);font-weight:600;margin:0 2px}
#map{display:grid;grid-template-columns:repeat(7,10px);gap:3px;padding:7px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px}
#map button,#map i{width:10px;height:10px;padding:0;border:none;border-radius:2px;display:block}
#map button{background:var(--line);cursor:pointer}
#map button.full{background:var(--muted)}
#map button.here{background:var(--accent)}

/* ブラックスクリーン */
#black{position:fixed;inset:0;z-index:100;background:#000;cursor:none}
#black[hidden]{display:none}

/* 共有ダイアログ */
#shareBtn{padding:0 14px;cursor:pointer;font-size:13px;font-weight:700}
#modal{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(10,12,18,.45)}
#modal[hidden]{display:none}
#mbox{width:min(560px,100%);max-height:100%;overflow:auto;padding:22px;background:var(--sheet);color:var(--ink);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
#mbox h2{font-size:18px;margin-bottom:6px}
.mnote{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.mwarn{font-size:12px;color:var(--accent);line-height:1.5}
#slink{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--chip);
  font-family:var(--mono);font-size:12px;outline:none;color:var(--ink)}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.mact .btn{height:36px;padding:0 14px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.pv{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.pvt{font-weight:700;font-size:16px;margin-bottom:6px}
.pvb{font-family:var(--mono);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:38vh;overflow:auto;margin:0}
.mimp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mimp label{display:flex;align-items:center;gap:4px}
.mimp input{width:56px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--sheet);
  text-align:center;font-family:var(--mono);font-size:13px;outline:none;color:var(--ink)}
.mimp input:focus{border-color:var(--accent)}

@media (max-width:880px){
  #toolbar{left:10px;right:10px;top:10px;flex-wrap:wrap}
  .search{flex:1 1 200px}
  #q{flex:1;width:auto}
  .sh-head{padding:112px 18px 2px;gap:10px;min-height:0}
  .title{font-size:19px}
  .body{padding:8px 18px 22px}
  #nav{opacity:.8;right:10px;bottom:10px}
  #results{left:0;right:0;width:auto;top:auto;margin-top:6px;position:absolute;top:100%}
}
@media (min-width:881px){ .sh-head{--reserve:640px} }
@media (min-width:600px) and (max-width:880px){ .sh-head{padding-top:64px} }
@media (prefers-reduced-motion:reduce){ #world{transition:none!important} .sheet.flash .coord{animation:none} }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="world"></div></div>

  <div id="toolbar">
    <div class="pill search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="検索（Ctrl+K）" autocomplete="off" spellcheck="false" aria-label="検索">
      <select id="scope" aria-label="検索範囲">
        <option value="all">全体</option>
        <option value="row">この行</option>
        <option value="col">この列</option>
      </select>
    </div>
    <div class="pill jump" id="jump">
      <label>行<input id="jr" inputmode="numeric" autocomplete="off" aria-label="移動先の行"></label>
      <label>列<input id="jc" inputmode="numeric" autocomplete="off" aria-label="移動先の列"></label>
      <button class="btn" id="jgo">移動</button>
    </div>
    <button class="pill" id="fontBtn" title="フォント切り替え（Ctrl+Q）" aria-label="フォント切り替え">Aa</button>
    <button class="pill" id="shareBtn" title="表示中のシートを共有">共有</button>
    <div id="results" hidden></div>
  </div>

  <div id="nav">
    <div id="pos"></div>
    <div id="map" aria-label="周辺のシート"></div>
  </div>

  <div id="modal" hidden><div id="mbox" role="dialog" aria-modal="true"></div></div>
  <div id="black" hidden></div>
</div>

<script>
(() => {
  const STORE = 'tile_notepad_v1', MIN = 1, MAX = 9999;
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), world = $('#world');
  const qEl = $('#q'), scopeEl = $('#scope'), resEl = $('#results');
  const jr = $('#jr'), jc = $('#jc'), jumpEl = $('#jump');
  const mapEl = $('#map'), posEl = $('#pos'), fontBtn = $('#fontBtn');

  /* ---------- データ ---------- */
  let db = { sheets: {}, pos: { r: 1, c: 1 }, font: 'mono' };
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && p.sheets) db = Object.assign(db, p);
    } else {
      // 旧バージョンのメモを (1,1) に引き継ぐ
      const old = localStorage.getItem('mega_notepad_content_v5');
      if (old) db.sheets['1,1'] = { t: '以前のメモ', b: old, u: Date.now() };
      if (localStorage.getItem('mega_notepad_font_v5') === 'sans') db.font = 'sans';
    }
  } catch (e) {}
  const sheets = db.sheets;
  const clamp = n => Math.max(MIN, Math.min(MAX, n));
  const key = (r, c) => r + ',' + c;
  let cur = { r: clamp(+db.pos?.r || 1), c: clamp(+db.pos?.c || 1) };

  let saveT;
  const save = () => { clearTimeout(saveT); saveT = setTimeout(saveNow, 300); };
  function saveNow() {
    clearTimeout(saveT); db.pos = cur;
    try { localStorage.setItem(STORE, JSON.stringify(db)); } catch (e) {}
  }
  addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

  const esc = s => s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  function rel(t) {
    const d = (Date.now() - t) / 1000;
    if (d < 45) return 'たった今';
    if (d < 3600) return Math.round(d / 60) + '分前';
    if (d < 86400) return Math.round(d / 3600) + '時間前';
    if (d < 86400 * 7) return Math.round(d / 86400) + '日前';
    const x = new Date(t), p = n => String(n).padStart(2, '0');
    return `${x.getFullYear()}/${p(x.getMonth() + 1)}/${p(x.getDate())}`;
  }

  /* ---------- 文字サイズ自動調整 ---------- */
  function fit(ta) {
    if (!ta.clientHeight) return;
    if (!ta.value) { ta.style.fontSize = db.tiny ? '5px' : '24px'; return; }
    const ok = () => ta.scrollHeight <= ta.clientHeight && ta.scrollWidth <= ta.clientWidth;
    let lo = 2, hi = db.tiny ? 5 : 60; // 極小モードは 5px が上限
    ta.style.fontSize = hi + 'px';
    if (ok()) return;
    while (hi - lo > 0.5) {
      const mid = (lo + hi) / 2;
      ta.style.fontSize = mid + 'px';
      if (ok()) lo = mid; else hi = mid;
    }
    ta.style.fontSize = lo + 'px';
  }

  /* ---------- シート生成と描画 ---------- */
  let W = 0, H = 0, anim = false;
  const pool = new Map();
  const measure = () => { W = stage.clientWidth; H = stage.clientHeight; };
  const setOffset = (x, y) => { world.style.transform = `translate3d(${x}px,${y}px,0)`; };

  function setUpd(o) {
    const s = sheets[key(o.r, o.c)];
    o.upd.textContent = s ? '編集 ' + rel(s.u) : '';
  }

  function makeSheet(r, c) {
    const el = document.createElement('section');
    el.className = 'sheet';
    el.innerHTML =
      `<header class="sh-head"><span class="coord">行<b>${r}</b>列<b>${c}</b></span>` +
      `<input class="title" placeholder="無題" maxlength="200" spellcheck="false" aria-label="タイトル">` +
      `<span class="upd"></span></header>` +
      `<textarea class="body" spellcheck="false" aria-label="本文" placeholder="ここに無限に書き込む…&#10;&#10;スワイプ・ドラッグ・ホイールで隣のシートへ"></textarea>`;
    const o = { el, r, c, title: el.querySelector('.title'), body: el.querySelector('.body'), upd: el.querySelector('.upd') };
    const s = sheets[key(r, c)];
    o.title.value = s ? s.t : '';
    o.body.value = s ? s.b : '';
    o.title.addEventListener('input', () => edit(o, 't', o.title.value));
    o.title.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); o.body.focus(); } });
    o.body.addEventListener('input', () => { edit(o, 'b', o.body.value); fit(o.body); });
    world.appendChild(el);
    setUpd(o);
    return o;
  }

  function edit(o, k, v) {
    const id = key(o.r, o.c);
    const s = sheets[id] || (sheets[id] = { t: '', b: '', u: 0 });
    s[k] = v; s.u = Date.now();
    if (!s.t && !s.b) delete sheets[id];
    setUpd(o); save(); drawMap();
    if (qEl.value.trim()) schedSearch();
  }

  function render() {
    const need = [[0, 0], [0, 1], [0, -1], [1, 0], [-1, 0]]
      .map(([dr, dc]) => [cur.r + dr, cur.c + dc])
      .filter(([r, c]) => r >= MIN && c >= MIN && r <= MAX && c <= MAX);
    const keep = new Set();
    for (const [r, c] of need) {
      const k = key(r, c); keep.add(k);
      let o = pool.get(k);
      const fresh = !o;
      if (!o) { o = makeSheet(r, c); pool.set(k, o); }
      Object.assign(o.el.style, { width: W + 'px', height: H + 'px', left: (c - cur.c) * W + 'px', top: (r - cur.r) * H + 'px' });
      o.el.inert = !(r === cur.r && c === cur.c);
      if (fresh) fit(o.body);
    }
    for (const [k, o] of pool) {
      if (keep.has(k)) continue;
      if (o.el.contains(document.activeElement)) document.activeElement.blur();
      o.el.remove(); pool.delete(k);
    }
    setOffset(0, 0);
    drawMap();
  }

  function animateTo(x, y, done) {
    anim = true;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    world.style.transition = reduce ? 'none' : 'transform 280ms cubic-bezier(.22,.8,.24,1)';
    setOffset(x, y);
    let fin = false;
    const end = () => {
      if (fin) return; fin = true;
      world.style.transition = ''; anim = false;
      done && done();
    };
    world.addEventListener('transitionend', end, { once: true });
    setTimeout(end, reduce ? 0 : 340);
  }

  function afterMove() {
    save();
    if (qEl.value.trim() && scopeEl.value !== 'all') runSearch(false);
  }

  function step(dr, dc) {
    if (anim) return;
    const r = cur.r + dr, c = cur.c + dc;
    if (r < MIN || c < MIN || r > MAX || c > MAX) {
      animateTo(-dc * 28, -dr * 28, () => animateTo(0, 0));
      return;
    }
    animateTo(-dc * W, -dr * H, () => { cur = { r, c }; render(); afterMove(); });
  }

  function flash(o) {
    o.el.classList.remove('flash'); void o.el.offsetWidth; o.el.classList.add('flash');
  }

  function goTo(r, c, sel) {
    r = clamp(r); c = clamp(c);
    const dr = r - cur.r, dc = c - cur.c;
    const finish = () => {
      const o = pool.get(key(r, c));
      if (!o) return;
      flash(o);
      if (sel && matchMedia('(pointer: fine)').matches) {
        const f = sel.f === 't' ? o.title : o.body;
        f.focus({ preventScroll: true });
        f.setSelectionRange(sel.i, sel.i + sel.len);
      }
    };
    if (!dr && !dc) { finish(); return; }
    if (Math.abs(dr) + Math.abs(dc) === 1 && !anim) {
      animateTo(-dc * W, -dr * H, () => { cur = { r, c }; render(); afterMove(); finish(); });
      return;
    }
    cur = { r, c }; render(); afterMove();
    const o = pool.get(key(r, c));
    if (o && o.el.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches)
      o.el.animate([{ opacity: 0, transform: 'scale(.985)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'ease-out' });
    finish();
  }

  /* ---------- スワイプ／ドラッグ ---------- */
  let drag = null;
  stage.addEventListener('pointerdown', e => {
    if (e.button !== 0 || anim) return;
    if (e.pointerType === 'mouse' && e.target.closest('textarea,input')) return; // マウスは文字選択を優先
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, axis: null, d: 0, v: 0, pd: 0, pt: performance.now(), focus: document.activeElement };
  });
  addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.axis) {
      if (Math.hypot(dx, dy) < 10) return;
      drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
      hideResults();
    }
    let d = drag.axis === 'x' ? dx : dy;
    const atEdge = (drag.axis === 'x' ? cur.c : cur.r) <= MIN;
    if (d > 0 && atEdge) d *= 0.25;
    const now = performance.now();
    const v = (d - drag.pd) / Math.max(1, now - drag.pt);
    drag.v = drag.v * 0.4 + v * 0.6; drag.pd = d; drag.pt = now; drag.d = d;
    setOffset(drag.axis === 'x' ? d : 0, drag.axis === 'y' ? d : 0);
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const g = drag; drag = null;
    if (!g.axis) return;
    // スワイプ後に入力欄へフォーカスが移らないようにする
    const stop = ev => { ev.stopPropagation(); ev.preventDefault(); };
    addEventListener('click', stop, { capture: true, once: true });
    setTimeout(() => {
      removeEventListener('click', stop, true);
      const a = document.activeElement;
      if (a !== g.focus && stage.contains(a)) a.blur();
    }, 60);
    const size = g.axis === 'x' ? W : H;
    let s = 0;
    if (g.d < -size * 0.18 || g.v < -0.5) s = 1;
    else if (g.d > size * 0.18 || g.v > 0.5) s = -1;
    if ((s === 1 && g.d > 0) || (s === -1 && g.d < 0)) s = 0;
    const dr = g.axis === 'y' ? s : 0, dc = g.axis === 'x' ? s : 0;
    const r = cur.r + dr, c = cur.c + dc;
    if (!s || r < MIN || c < MIN || r > MAX || c > MAX) { animateTo(0, 0); return; }
    animateTo(-dc * W, -dr * H, () => { cur = { r, c }; render(); afterMove(); });
  }
  addEventListener('pointerup', endDrag);
  addEventListener('pointercancel', endDrag);
  stage.addEventListener('scroll', () => { stage.scrollTop = 0; stage.scrollLeft = 0; });

  /* ---------- ホイール／トラックパッド ---------- */
  let wx = 0, wy = 0, wLock = 0, wT;
  stage.addEventListener('wheel', e => {
    if (e.ctrlKey) return;
    e.preventDefault();
    const now = performance.now();
    if (now < wLock) { wLock = now + 180; return; } // 慣性スクロールの尾を無視
    let dx = e.deltaX, dy = e.deltaY;
    if (e.shiftKey && !dx) { dx = dy; dy = 0; }
    wx += dx; wy += dy;
    clearTimeout(wT); wT = setTimeout(() => { wx = wy = 0; }, 200);
    if (Math.abs(wx) > 80 || Math.abs(wy) > 80) {
      if (Math.abs(wx) > Math.abs(wy)) step(0, Math.sign(wx)); else step(Math.sign(wy), 0);
      wx = wy = 0; wLock = now + 450;
    }
  }, { passive: false });

  /* ---------- 検索 ---------- */
  let hits = [], selIdx = -1, sT;
  const schedSearch = () => { clearTimeout(sT); sT = setTimeout(() => runSearch(false), 150); };
  const hideResults = () => { resEl.hidden = true; };

  function snippet(text, i, len) {
    const a = Math.max(0, i - 22), b = Math.min(text.length, i + len + 70);
    const fl = s => esc(s.replace(/\s+/g, ' '));
    return (a > 0 ? '…' : '') + fl(text.slice(a, i)) + '<mark>' + fl(text.slice(i, i + len)) + '</mark>' + fl(text.slice(i + len, b));
  }

  function runSearch(open = true) {
    const raw = qEl.value.trim();
    if (!raw) { hideResults(); hits = []; return; }
    const q = raw.toLowerCase(), sc = scopeEl.value;
    const T = [], B = [];
    for (const k in sheets) {
      const [r, c] = k.split(',').map(Number);
      if (sc === 'row' && r !== cur.r) continue;
      if (sc === 'col' && c !== cur.c) continue;
      const s = sheets[k];
      const ti = s.t.toLowerCase().indexOf(q);
      if (ti >= 0) { T.push({ r, c, s, f: 't', i: ti }); continue; }
      const bi = s.b.toLowerCase().indexOf(q);
      if (bi >= 0) B.push({ r, c, s, f: 'b', i: bi });
    }
    const byRecent = (a, b) => b.s.u - a.s.u;
    T.sort(byRecent); B.sort(byRecent);
    hits = [...T, ...B]; selIdx = hits.length ? 0 : -1;
    const len = raw.length;
    const scopeTxt = sc === 'row' ? `${cur.r}行目のみ` : sc === 'col' ? `${cur.c}列目のみ` : '全体';
    let h = `<div class="rhead"><span>${hits.length}件</span><span>${scopeTxt}</span></div>`;
    if (!hits.length) h += `<div class="empty">一致するシートはありません。範囲を「全体」にすると他の行や列も探せます。</div>`;
    const item = (x, idx) => {
      const title = x.f === 't'
        ? esc(x.s.t.slice(0, x.i)) + '<mark>' + esc(x.s.t.slice(x.i, x.i + len)) + '</mark>' + esc(x.s.t.slice(x.i + len))
        : (x.s.t ? esc(x.s.t) : '<span style="opacity:.6">無題</span>');
      const sub = x.f === 'b' ? snippet(x.s.b, x.i, len) : esc(x.s.b.slice(0, 90).replace(/\s+/g, ' '));
      return `<button class="hit${idx === selIdx ? ' sel' : ''}" data-i="${idx}">` +
        `<span class="hc">${x.r}行 ${x.c}列</span><span class="ht">${title}</span>` +
        `<span class="hu">${rel(x.s.u)}</span><span class="hs">${sub}</span></button>`;
    };
    if (T.length) h += `<div class="grp">タイトル</div>` + T.map((x, i) => item(x, i)).join('');
    if (B.length) h += `<div class="grp">本文</div>` + B.map((x, i) => item(x, T.length + i)).join('');
    resEl.innerHTML = h;
    if (open || !resEl.hidden || document.activeElement === qEl) resEl.hidden = false;
  }

  function openHit(i) {
    const x = hits[i]; if (!x) return;
    hideResults();
    goTo(x.r, x.c, { f: x.f, i: x.i, len: qEl.value.trim().length });
  }
  function moveSel(d) {
    if (!hits.length) return;
    selIdx = (selIdx + d + hits.length) % hits.length;
    resEl.querySelectorAll('.hit').forEach(b => b.classList.toggle('sel', +b.dataset.i === selIdx));
    resEl.querySelector('.hit.sel')?.scrollIntoView({ block: 'nearest' });
  }

  qEl.addEventListener('input', () => { clearTimeout(sT); sT = setTimeout(() => runSearch(true), 120); });
  qEl.addEventListener('focus', () => { if (qEl.value.trim()) runSearch(true); });
  qEl.addEventListener('keydown', e => {
    if (e.isComposing) return;
    if (e.key === 'Enter') { e.preventDefault(); openHit(selIdx < 0 ? 0 : selIdx); qEl.blur(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
  });
  scopeEl.addEventListener('change', () => runSearch(true));
  resEl.addEventListener('click', e => {
    const b = e.target.closest('.hit');
    if (b) openHit(+b.dataset.i);
  });
  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('#toolbar')) hideResults();
  });

  /* ---------- 番号ジャンプ ---------- */
  function jumpGo() {
    // 「3 5」「3,5」のように1つの欄にまとめて入力しても可
    const m = jr.value.match(/^\s*(\d+)\s*[\s,、，.:・x×]\s*(\d+)\s*$/);
    if (m) { jr.value = m[1]; jc.value = m[2]; }
    const r = parseInt(jr.value || cur.r, 10), c = parseInt(jc.value || cur.c, 10);
    if (!(r >= MIN && r <= MAX && c >= MIN && c <= MAX)) {
      jumpEl.classList.remove('err'); void jumpEl.offsetWidth; jumpEl.classList.add('err');
      return;
    }
    jr.blur(); jc.blur(); hideResults();
    goTo(r, c);
    jr.value = ''; jc.value = '';
  }
  $('#jgo').addEventListener('click', jumpGo);
  jr.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    if (!jc.value && !/[\s,、，.:・x×]/.test(jr.value.trim())) jc.focus(); else jumpGo();
  });
  jc.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); jumpGo(); } });

  /* ---------- 位置表示とミニマップ ---------- */
  function drawMap() {
    let h = '';
    for (let dr = -3; dr <= 3; dr++) for (let dc = -3; dc <= 3; dc++) {
      const r = cur.r + dr, c = cur.c + dc;
      if (r < MIN || c < MIN || r > MAX || c > MAX) { h += '<i></i>'; continue; }
      const s = sheets[key(r, c)];
      const cls = (!dr && !dc ? 'here ' : '') + (s ? 'full' : '');
      const tip = `${r}行 ${c}列` + (s && s.t ? '：' + s.t : '');
      h += `<button class="${cls}" data-r="${r}" data-c="${c}" title="${esc(tip)}" aria-label="${esc(tip)}"></button>`;
    }
    mapEl.innerHTML = h;
    posEl.innerHTML = `<b>${cur.r}</b>行 <b>${cur.c}</b>列`;
    jr.placeholder = cur.r; jc.placeholder = cur.c;
  }
  mapEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) goTo(+b.dataset.r, +b.dataset.c);
  });

  /* ---------- フォント切り替え ---------- */
  function applyFont() {
    stage.classList.toggle('sans', db.font === 'sans');
    stage.classList.toggle('tiny', !!db.tiny);
    fontBtn.style.fontFamily = db.font === 'sans' ? 'var(--sans)' : 'var(--mono)';
  }
  function toggleFont() {
    db.font = db.font === 'sans' ? 'mono' : 'sans';
    applyFont(); pool.forEach(o => fit(o.body)); save();
  }
  fontBtn.addEventListener('click', toggleFont);
  function toggleTiny() {
    db.tiny = !db.tiny;
    applyFont(); pool.forEach(o => fit(o.body)); save();
  }

  /* ---------- 共有（リンクにシートを埋め込む） ---------- */
  // 共有リンクの行き先。空のままなら、このページ自身のURL（GitHub Pages など）を使う。
  // ローカルファイルからも共有したい場合は、公開URLをここに書く（例: 'https://ユーザー名.github.io/リポジトリ名/'）
  const SHARE_BASE = 'https://0128-game.github.io/big-memo/';
  const SHARE_URL = SHARE_BASE ||
    (/claude/.test(location.hostname) ? 'https://claude.ai/artifact/ML79ypZ25rAQC2eBiJL2nU'
      : /^https?:$/.test(location.protocol) ? location.origin + location.pathname : '');
  const modal = $('#modal'), mBox = $('#mbox');
  const b64u = bytes => {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  };
  const unb64u = str => {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    const bin = atob(str), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  };
  async function pipe(bytes, Stream) {
    const st = new Blob([bytes]).stream().pipeThrough(new Stream('deflate-raw'));
    return new Uint8Array(await new Response(st).arrayBuffer());
  }
  async function encodeSheet(d) {
    const raw = new TextEncoder().encode(JSON.stringify(d));
    if ('CompressionStream' in window) { try { return 's' + b64u(await pipe(raw, CompressionStream)); } catch (e) {} }
    return 'u' + b64u(raw);
  }
  async function decodeSheet(tok) {
    const kind = tok[0], bytes = unb64u(tok.slice(1));
    const raw = kind === 's' ? await pipe(bytes, DecompressionStream) : kind === 'u' ? bytes : null;
    if (!raw) throw new Error('bad');
    const d = JSON.parse(new TextDecoder().decode(raw));
    if (typeof d.t !== 'string' || typeof d.b !== 'string') throw new Error('bad');
    return d;
  }
  function fmtDate(t) {
    const x = new Date(t), p = n => String(n).padStart(2, '0');
    return `${x.getFullYear()}/${p(x.getMonth() + 1)}/${p(x.getDate())} ${p(x.getHours())}:${p(x.getMinutes())}`;
  }
  function openModal(html) {
    hideResults();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    mBox.innerHTML = html; modal.hidden = false;
  }
  function closeModal() { modal.hidden = true; mBox.innerHTML = ''; }
  modal.addEventListener('pointerdown', e => { if (e.target === modal) closeModal(); });
  mBox.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });

  async function shareCurrent() {
    const s = sheets[key(cur.r, cur.c)];
    if (!s) {
      openModal(`<h2>このシートは空です</h2><p class="mnote">タイトルか本文を書いてから共有してください。</p><div class="mact"><button class="btn" data-close>閉じる</button></div>`);
      return;
    }
    if (!SHARE_URL) {
      openModal(`<h2>このままでは共有リンクを作れません</h2><p class="mnote">ファイルを直接開いているため、相手が開けるURLがありません。公開しているURL（GitHub Pages など）から開くか、ファイル内の SHARE_BASE に公開URLを書いてください。</p><div class="mact"><button class="btn" data-close>閉じる</button></div>`);
      return;
    }
    const url = SHARE_URL + '#m1' + await encodeSheet({ t: s.t, b: s.b, r: cur.r, c: cur.c, u: s.u });
    openModal(
      `<h2>${cur.r}行 ${cur.c}列を共有</h2>` +
      `<p class="mnote">このリンクを開いた人には、このシートの今の内容だけが表示されます。後で編集しても相手側には反映されません。</p>` +
      `<input id="slink" readonly value="${esc(url)}" aria-label="共有リンク">` +
      (url.length > 8000 ? `<p class="mwarn" style="margin-top:8px">本文が長いためリンクがとても長くなっています。送り先のアプリによっては途中で切れることがあります。</p>` : '') +
      `<div class="mact">${navigator.share ? '<button class="btn ghost" id="snative">他のアプリで送る</button>' : ''}` +
      `<button class="btn" id="scopy">リンクをコピー</button></div>`
    );
    const inp = $('#slink');
    inp.addEventListener('focus', () => inp.select());
    $('#scopy').onclick = async () => {
      let ok = false;
      try { await navigator.clipboard.writeText(url); ok = true; }
      catch (e) { inp.focus(); inp.select(); try { ok = document.execCommand('copy'); } catch (_) {} }
      $('#scopy').textContent = ok ? 'コピーしました' : 'リンクを選択しました。手動でコピーしてください';
    };
    const n = $('#snative');
    if (n) n.onclick = () => navigator.share({ title: s.t || 'メモ', url }).catch(() => {});
  }
  $('#shareBtn').addEventListener('click', shareCurrent);

  function clearHash() {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
  }
  async function handleHash() {
    const tok = decodeURIComponent(location.hash.slice(1));
    if (!tok.startsWith('m1')) return;
    clearHash();
    let d;
    try { d = await decodeSheet(tok.slice(2)); }
    catch (e) {
      openModal(`<h2>共有リンクを読み込めませんでした</h2><p class="mnote">リンクが途中で切れている可能性があります。送ってくれた人に、リンク全体をもう一度送ってもらってください。</p><div class="mact"><button class="btn" data-close>閉じる</button></div>`);
      return;
    }
    let tc = cur.c;
    while (sheets[key(cur.r, tc)] && tc < MAX) tc++;
    const from = Number.isInteger(d.r) && Number.isInteger(d.c) ? `送り主の ${d.r}行 ${d.c}列 のシート` : '共有されたシート';
    openModal(
      `<h2>共有されたシート</h2>` +
      `<p class="mnote">${from}${typeof d.u === 'number' ? `（${fmtDate(d.u)} 時点の内容）` : ''}</p>` +
      `<div class="pv"><div class="pvt">${d.t ? esc(d.t) : '<span style="opacity:.55">無題</span>'}</div><pre class="pvb">${esc(d.b)}</pre></div>` +
      `<div class="mimp">取り込み先 <label>行<input id="ir" inputmode="numeric" value="${cur.r}"></label>` +
      `<label>列<input id="ic" inputmode="numeric" value="${tc}"></label><span id="iwarn" class="mwarn"></span></div>` +
      `<div class="mact"><button class="btn ghost" data-close>取り込まない</button><button class="btn" id="iok">自分のメモに取り込む</button></div>`
    );
    const ir = $('#ir'), ic = $('#ic'), warn = $('#iwarn');
    const check = () => {
      const r = parseInt(ir.value, 10), c = parseInt(ic.value, 10);
      const okv = r >= MIN && r <= MAX && c >= MIN && c <= MAX;
      warn.textContent = !okv ? '1〜9999 の番号を入れてください' : sheets[key(r, c)] ? 'このシートには内容があり、上書きされます' : '';
      return okv ? { r, c } : null;
    };
    ir.oninput = ic.oninput = check; check();
    $('#iok').onclick = () => {
      const p = check(); if (!p) return;
      sheets[key(p.r, p.c)] = { t: d.t, b: d.b, u: Date.now() };
      const o = pool.get(key(p.r, p.c));
      if (o) { o.title.value = d.t; o.body.value = d.b; fit(o.body); setUpd(o); }
      saveNow(); closeModal(); goTo(p.r, p.c); drawMap();
    };
  }
  addEventListener('hashchange', handleHash);

  /* ---------- ブラックスクリーン ---------- */
  // blackMode: 'off' | 'black'（入力も止める）| 'type'（黒いまま文字を打てる）
  const black = $('#black');
  let lastFocus = null, blackMode = 'off';
  function setBlack(mode) {
    if (mode === blackMode) mode = 'off';
    if (mode === 'off') {
      black.hidden = true; blackMode = 'off';
      if (lastFocus && lastFocus !== document.body && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
      return;
    }
    if (blackMode === 'off') lastFocus = document.activeElement;
    hideResults();
    if (mode === 'black') {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // 見えない状態で文字が入らないように
    } else {
      // 入力中の欄がなければ、表示中シートの本文末尾にカーソルを置く
      const a = lastFocus;
      const o = pool.get(key(cur.r, cur.c));
      const inSheet = a && o && o.el.contains(a);
      if (inSheet) a.focus({ preventScroll: true });
      else if (o) { o.body.focus({ preventScroll: true }); const n = o.body.value.length; o.body.setSelectionRange(n, n); }
    }
    blackMode = mode; black.hidden = false;
  }
  const toggleBlack = () => setBlack('off');
  black.addEventListener('pointerdown', e => e.preventDefault()); // クリックで入力欄のフォーカスが外れないように
  black.addEventListener('dblclick', toggleBlack); // スマホなどはダブルタップで解除

  /* ---------- キーボード ---------- */
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'b') { e.preventDefault(); setBlack(e.shiftKey ? 'type' : 'black'); return; }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && k === 'm') { e.preventDefault(); toggleTiny(); return; }
    if (blackMode === 'black') { e.preventDefault(); if (e.key === 'Escape') toggleBlack(); return; }
    if (blackMode === 'type') { if (e.key === 'Escape') { e.preventDefault(); toggleBlack(); } return; }
    if (!modal.hidden) { if (e.key === 'Escape') closeModal(); return; }
    if ((e.ctrlKey || e.metaKey) && k === 'q') { e.preventDefault(); toggleFont(); return; }
    if ((e.ctrlKey || e.metaKey) && k === 'k') { e.preventDefault(); qEl.focus(); qEl.select(); return; }
    if (e.key === 'Escape') { hideResults(); document.activeElement?.blur(); return; }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    const dirs = { arrowup: [-1, 0], arrowdown: [1, 0], arrowleft: [0, -1], arrowright: [0, 1] };
    if (dirs[k] && ((!typing && !e.ctrlKey && !e.metaKey) || (e.altKey && e.shiftKey))) {
      e.preventDefault(); step(...dirs[k]);
    }
  });

  /* ---------- 起動 ---------- */
  addEventListener('resize', () => { measure(); render(); pool.forEach(o => fit(o.body)); });
  setInterval(() => pool.forEach(setUpd), 30000);
  applyFont(); measure(); render(); handleHash();
  document.fonts?.ready.then(() => pool.forEach(o => fit(o.body)));
})();
</script>
</body>
</html>
